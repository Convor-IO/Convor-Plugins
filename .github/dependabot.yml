# Dependabot — Convor-Plugins
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Coverage:
#   npm            — root pnpm-lock.yaml (packages/* + segment workspace)
#                    + three npm-locked platform subdirs that carry their own
#                      package-lock.json: /bigcommerce, /ecwid, /integration-tests
#   github-actions — .github/workflows/*.yml (no workflows yet; block is in
#                    place so bumps are proposed as soon as CI lands)
#   docker-compose — integration-test fixture stacks under
#                    /integration-tests/fixtures/<platform>/docker-compose.yml
#                    (wordpress, drupal, joomla, magento, opencart, prestashop)
#
# All container images use EXPLICIT version tags (no `latest`, no bare majors).
# Direction: track LATEST mariadb/postgres everywhere, EXCEPT where an external
# CMS has a hard version cap — those are pinned + blocked via `ignore` rules:
#   - Magento fixture:    mariadb pinned to 10.6 (Magento 2.4 hard requirement)
#   - PrestaShop fixture: mysql pinned to 8.0    (PrestaShop 8 hard requirement)
# The `docker-compose` ecosystem has no `groups` support, so each image bump
# opens its own PR.
#
# Mirrors saas/website/mailer conventions; kept in sync.
version: 2

updates:
  # ── npm (pnpm workspace root) ──────────────────────────────────────────
  # Root pnpm-lock.yaml covers packages/widget-sdk, packages/widget-react,
  # and segment. Schedule: weekly, Monday.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 15
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Cooldown: don't propose a release until it has aged past pnpm's
    # minimumReleaseAge (24h on the CI runner). Without this Dependabot
    # opens PRs the moment a version is published and `pnpm install
    # --frozen-lockfile` rejects them with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION.
    # Applied to all npm entries below too (incl. npm-locked subdirs) for
    # consistent supply-chain hygiene. Majors cool longer since they
    # carry more risk.
    cooldown:
      default-days: 2
      semver-major-days: 7
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      testing:
        patterns: ["@playwright/*", "playwright", "vitest", "@vitest/*"]

  # ── npm (npm-locked platform subdirs) ──────────────────────────────────
  # Each of these ships its own package-lock.json and is NOT part of the pnpm
  # workspace, so each needs a dedicated entry. Same schedule/prefix as root.
  - package-ecosystem: "npm"
    directory: "/bigcommerce"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    cooldown:
      default-days: 2
      semver-major-days: 7
    groups:
      fastify:
        patterns: ["fastify", "@fastify/*"]

  - package-ecosystem: "npm"
    directory: "/ecwid"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    cooldown:
      default-days: 2
      semver-major-days: 7
    groups:
      fastify:
        patterns: ["fastify", "@fastify/*"]

  - package-ecosystem: "npm"
    directory: "/integration-tests"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-dev)"
    cooldown:
      default-days: 2
      semver-major-days: 7

  # ── GitHub Actions ─────────────────────────────────────────────────────
  # No .github/workflows yet — this block is a no-op until CI is added, at
  # which point it will pick up pinned actions automatically. Schedule: Tue.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"

  # ── Docker Compose (integration-test fixtures) ─────────────────────────
  # Six platform fixture stacks, each its own docker-compose.yml. One entry
  # per directory. Schedule: weekly, Wednesday.
  - package-ecosystem: "docker-compose"
    directory: "/integration-tests/fixtures/wordpress"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker-compose"
    directory: "/integration-tests/fixtures/drupal"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker-compose"
    directory: "/integration-tests/fixtures/joomla"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Magento: MariaDB is HARD-PINNED to 10.6 (Magento 2.4 hard requirement —
  # newer MariaDB breaks setup:install). Block all bumps for it; other images
  # in this fixture (opensearch, php) still update normally.
  - package-ecosystem: "docker-compose"
    directory: "/integration-tests/fixtures/magento"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "mariadb"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker-compose"
    directory: "/integration-tests/fixtures/opencart"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # PrestaShop: MySQL is HARD-PINNED to 8.0 (PrestaShop 8 hard requirement —
  # MySQL 8.4+ drops the mysql_native_password default the installer relies
  # on). Block all bumps for it.
  - package-ecosystem: "docker-compose"
    directory: "/integration-tests/fixtures/prestashop"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
