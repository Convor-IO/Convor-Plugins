name: Dependabot green auto-merge

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge-green:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh stale Dependabot PRs and merge only green ones
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh pr list --repo "$GH_REPO" --state open --limit 100 \
            --json number,author,mergeStateStatus,statusCheckRollup \
            --jq '.[] | select(.author.login == "app/dependabot" or .author.login == "dependabot[bot]") | @base64' |
          while IFS= read -r encoded; do
            pr="$(printf '%s' "$encoded" | base64 --decode)"
            number="$(jq -r '.number' <<<"$pr")"
            merge_state="$(jq -r '.mergeStateStatus' <<<"$pr")"

            has_cancelled="$(jq -r '[.statusCheckRollup[]? | select((.conclusion // .state // "") == "CANCELLED")] | length > 0' <<<"$pr")"
            if [[ "$merge_state" == "BEHIND" || "$has_cancelled" == "true" ]]; then
              echo "Refreshing Dependabot PR #$number ($merge_state, cancelled=$has_cancelled)"
              gh pr update-branch "$number" --repo "$GH_REPO" || true
              continue
            fi

            check_count="$(jq -r '.statusCheckRollup | length' <<<"$pr")"
            if [[ "$check_count" -eq 0 ]]; then
              echo "Skipping #$number: no CI/CD checks"
              continue
            fi

            all_green="$(jq -r '
              all(.statusCheckRollup[];
                if .__typename == "CheckRun" then
                  .status == "COMPLETED" and
                  ((.conclusion // "") == "SUCCESS" or
                   (.conclusion // "") == "NEUTRAL" or
                   (.conclusion // "") == "SKIPPED")
                else
                  (.state // "") == "SUCCESS"
                end)
            ' <<<"$pr")"
            has_success="$(jq -r '
              any(.statusCheckRollup[];
                ((.conclusion // "") == "SUCCESS") or ((.state // "") == "SUCCESS"))
            ' <<<"$pr")"

            if [[ "$all_green" == "true" && "$has_success" == "true" ]]; then
              echo "Merging green Dependabot PR #$number"
              if ! gh pr merge "$number" --repo "$GH_REPO" --squash; then
                echo "Merge of #$number deferred; it will be reconsidered on the next daily run"
              fi
            else
              echo "Skipping #$number: CI/CD is not fully green"
            fi
          done
