name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Acquire shared CI host lock
        uses: ./.github/actions/ci-host-lock
        with:
          mode: acquire
          owner: ${{ github.run_id }}:${{ github.job }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate
        run: pnpm gate

      - name: Release shared CI host lock
        if: always()
        uses: ./.github/actions/ci-host-lock
        with:
          mode: release
          owner: ${{ github.run_id }}:${{ github.job }}
