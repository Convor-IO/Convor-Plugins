name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    # Plugin validation is hermetic and does not need Docker or private host
    # services. Keep it on GitHub-hosted capacity so dependency PRs can still
    # validate when the shared self-hosted machine is offline.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install standalone plugin dependencies
        shell: bash
        run: |
          npm ci --prefix integration-tests
          npm ci --prefix bigcommerce
          npm install --prefix ecwid --no-package-lock --no-audit --no-fund
          pnpm --dir browser-extension --ignore-workspace install --frozen-lockfile

      - name: Gate
        run: pnpm gate

      - name: Build WordPress release candidate
        run: python3 scripts/build-wordpress.py

      - name: Upload WordPress release candidate
        uses: actions/upload-artifact@v6
        with:
          name: wordpress-release-candidate
          path: |
            dist/convor-*.zip
            dist/convor-*.zip.sha256
          if-no-files-found: error
      - name: Build PrestaShop module
        run: |
          python3 integration-tests/prestashop-package.test.py
          python3 integration-tests/prestashop-marketplace-package.test.py
          python3 scripts/build-prestashop.py
          unzip -t dist/prestashop/convor.zip
          (cd dist/prestashop && sha256sum -c convor.zip.sha256)
      - name: Archive PrestaShop release candidate
        uses: actions/upload-artifact@v6
        with:
          name: prestashop-module
          path: dist/prestashop/
          if-no-files-found: error
