name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    # Plugin validation is hermetic and does not need Docker or private host
    # services. Keep it on GitHub-hosted capacity so dependency PRs can still
    # validate when the shared self-hosted machine is offline.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install standalone plugin dependencies
        shell: bash
        run: |
          npm ci --prefix integration-tests
          npm ci --prefix bigcommerce
          npm ci --prefix ecwid
          pnpm --dir browser-extension install --frozen-lockfile

      - name: Gate
        run: pnpm gate
