server {
    listen 80 default_server;
    server_name ps-qa-1807.topsoft4u.com;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store" always;
    client_max_body_size 8m;
    # Reject all unrelated hostnames, including an accidental DNS alias.
    if ($host != "ps-qa-1807.topsoft4u.com") { return 421; }
    location ~* ^/admin[^/]*(?:/|$) {
        auth_basic "Convor isolated PrestaShop QA";
        auth_basic_user_file /etc/nginx/qa-admin.htpasswd;
        proxy_pass http://prestashop:80;
        proxy_set_header Host ps-qa-1807.topsoft4u.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host ps-qa-1807.topsoft4u.com;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header X-Powered-By;
    }
    location ~* ^/(?:install[^/]*|api|config|var|app|src|vendor|translations|mails|classes|controllers|tools)(?:/|$) { return 404; }
    location ~ /\.(?!well-known/) { return 404; }
    location / {
        proxy_pass http://prestashop:80;
        proxy_set_header Host ps-qa-1807.topsoft4u.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host ps-qa-1807.topsoft4u.com;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header X-Powered-By;
    }
}
