# Local-only public HTTPS QA via the dedicated Cloudflare Tunnel.
# Only the gateway publishes a port, bound to loopback. Never use live data.
name: convor-ps-qa-1807
services:
  db:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_ROOT_PASSWORD: ${QA_DB_ROOT_PASSWORD:?}
      MYSQL_DATABASE: prestashop
      MYSQL_USER: prestashop
      MYSQL_PASSWORD: ${QA_DB_PASSWORD:?}
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - db:/var/lib/mysql
  prestashop:
    image: prestashop/prestashop:9.2.1@sha256:ad8ce05927bb28f5fb4da08a278dea43e10a1fed032e666baa27214303cfc8c9
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASSWD: ${QA_DB_PASSWORD:?}
      PS_INSTALL_AUTO: "1"
      PS_DOMAIN: ps-qa-1807.topsoft4u.com
      PS_ENABLE_SSL: "1"
      PS_FOLDER_ADMIN: admin-dev
      ADMIN_MAIL: prestashop-qa@example.test
      ADMIN_PASSWD: ${QA_ADMIN_PASSWORD:?}
      PS_LANGUAGE: en
      PS_COUNTRY: GB
      PS_DEV_MODE: "0"
    volumes:
      - shop:/var/www/html
      - ./public-qa-apache.conf:/etc/apache2/conf-enabled/convor-public-qa.conf:ro
  gateway:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    profiles: [public]
    depends_on: [prestashop]
    ports:
      - "127.0.0.1:18224:80"
    volumes:
      - ./public-qa-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${QA_STATE_DIR:?}/qa-admin.htpasswd:/etc/nginx/qa-admin.htpasswd:ro
  # Opt-in test-only bridge: the public shop stays off the SaaS network.
  # The relay has no published port and exposes only two POST endpoints.
  pairing-relay:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    profiles: [pairing]
    volumes:
      - ./public-qa-pairing-relay.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases: [server]
      saas: {}
networks:
  saas:
    external: true
    name: convor-feat-prestashop-finalization-1807-dev_convor
volumes:
  db:
  shop:
