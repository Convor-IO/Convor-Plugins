# Only the isolated PrestaShop fixture may use the relay. No host port,
# public route, admin endpoint or access to the underlying SaaS network.
server {
    listen 3000;
    server_name server;
    server_tokens off;
    access_log off;
    client_max_body_size 16k;
    location = /api/prestashop/pairing/redeem {
        limit_except POST { deny all; }
        proxy_pass http://convor-feat-prestashop-finalization-1807-dev-server-1:3000;
        proxy_set_header Host server:3000;
    }
    location = /api/auth/visitor-reset {
        limit_except POST { deny all; }
        proxy_pass http://convor-feat-prestashop-finalization-1807-dev-server-1:3000;
        proxy_set_header Host server:3000;
    }
    location / { return 404; }
}
