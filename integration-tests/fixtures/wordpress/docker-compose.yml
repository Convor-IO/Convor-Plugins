name: ${WP_COMPOSE_PROJECT:-convor-wordpress-test}
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: wordpress
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
  wp:
    image: ${WP_IMAGE:-wordpress:php8.3-apache}
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:${WP_PORT:-18206}:80"]
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp-data:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
  cli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    user: "33:33"
    depends_on:
      - wp
    environment: *wp-env
    volumes:
      - wp-data:/var/www/html
      - ../../..:/fixture-repo:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  wp-data:
