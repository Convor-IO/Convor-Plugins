# This file stores configurations for your Shopify app.
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration

client_id = ""
name = "Convor Live Chat"

[build]
include_config_on_deploy = true

[access]
# Convor needs to read/write the shop's metafields (namespace: convor) to
# store the merchant's org slug and apiBase for the widget loader.
use_legacy_install_flow = false

[access_scopes]
# metafieldsSet on shop metafields requires write_products, OR the newer
# `write_metafields` access scope. We request both to be safe across API
# versions and so we can also read shop data for display in settings.
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metafields,read_metafields"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://CONVOR_APP_URL/auth/callback",
  "https://CONVOR_APP_URL/auth/callback/inline",
  "https://CONVOR_APP_URL/auth/login",
]

[webhooks]
api_version = "2025-01"

  # Handled by: /app/routes/auth.$.tsx (the shopify-app-remix catch-all)
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance topics for public apps.
  # See: https://shopify.dev/docs/apps/build/privacy-law-compliance
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[app_preferences]
# Link to the Convor dashboard, surfaced inside Shopify admin.
url = "https://convor.io/dashboard"
