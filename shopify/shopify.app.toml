# This file stores configurations for your Shopify app.
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "fc4860b98a269311c46e07aa06a854ba"
name = "Convor Live Chat"
application_url = "https://editor-vsnet-jill-house.trycloudflare.com"
embedded = true

[build]

[access]
# Convor needs to read/write the shop's metafields (namespace: convor) to
# store the merchant's org slug and apiBase for the widget loader.
use_legacy_install_flow = false

[access_scopes]
# Shopify's current Dev Dashboard scope catalog does not expose separate
# metafield scopes. Product read/write scopes are the valid scope pair for
# this app's Admin GraphQL settings flow.
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://editor-vsnet-jill-house.trycloudflare.com/auth/callback",
  "https://editor-vsnet-jill-house.trycloudflare.com/auth/callback/inline",
  "https://editor-vsnet-jill-house.trycloudflare.com/auth/login",
]

[webhooks]
api_version = "2026-07"

  # Handled by: /app/routes/auth.$.tsx (the shopify-app-remix catch-all)
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance topics for public apps.
  # See: https://shopify.dev/docs/apps/build/privacy-law-compliance
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[app_preferences]
# Link to the Convor dashboard, surfaced inside Shopify admin.
url = "https://convor.io/dashboard"
