<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Convor</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f5f7f6;
        --ink: #0e1514;
        --muted: #5c6868;
        --line: #e3e8e7;
        --accent: #00a37a;
        --accent-ink: #007a5c;
        --warn: #b9651a;
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 312px;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--line);
      }

      .wordmark {
        font-weight: 650;
        font-size: 14px;
        letter-spacing: -0.01em;
      }

      .badge {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 11.5px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        flex: none;
      }
      .dot.ok {
        background: var(--accent);
        box-shadow: 0 0 0 3px rgba(0, 163, 122, 0.18);
      }
      .dot.warn {
        background: var(--warn);
        box-shadow: 0 0 0 3px rgba(185, 101, 26, 0.18);
      }

      main {
        padding: 12px 16px 14px;
      }

      .slug-row,
      .host-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 2px 0;
      }
      .slug-row .label,
      .host-row .label {
        color: var(--muted);
      }
      .slug-row .value {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .host-row {
        color: var(--muted);
        font-size: 11.5px;
        padding-top: 0;
      }
      .host-row .value {
        font-variant-numeric: tabular-nums;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: right;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      .primary {
        width: 100%;
        margin-top: 12px;
        padding: 9px 12px;
        background: var(--accent);
        color: #fff;
        border: 1px solid var(--accent);
        border-radius: var(--radius);
        font-weight: 600;
        transition: background 0.12s ease;
      }
      .primary:hover:not(:disabled) {
        background: var(--accent-ink);
        border-color: var(--accent-ink);
      }
      .primary:active:not(:disabled) {
        transform: translateY(0.5px);
      }
      .primary:disabled {
        background: var(--surface);
        border-color: var(--line);
        color: var(--muted);
        cursor: not-allowed;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 12px;
        padding: 8px 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        cursor: pointer;
      }
      .toggle-row .text {
        display: flex;
        flex-direction: column;
      }
      .toggle-row .text strong {
        font-weight: 600;
        font-size: 12.5px;
      }
      .toggle-row .text small {
        color: var(--muted);
        font-size: 11px;
      }

      /* Switch */
      .switch {
        position: relative;
        width: 32px;
        height: 18px;
        flex: none;
      }
      .switch input {
        opacity: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        position: absolute;
        inset: 0;
        cursor: pointer;
      }
      .track {
        position: absolute;
        inset: 0;
        background: #c9d1d0;
        border-radius: 999px;
        transition: background 0.14s ease;
      }
      .track::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.14s ease;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .switch input:checked + .track {
        background: var(--accent);
      }
      .switch input:checked + .track::after {
        transform: translateX(14px);
      }
      .switch input:focus-visible + .track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      footer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px 10px;
        border-top: 1px solid var(--line);
      }
      .ghost {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 12px;
        padding: 2px 0;
        text-decoration: none;
      }
      .ghost:hover {
        color: var(--ink);
      }

      .toast {
        margin-left: auto;
        color: var(--muted);
        font-size: 11.5px;
        opacity: 0;
        transition: opacity 0.15s ease;
        max-width: 150px;
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .toast.visible {
        opacity: 1;
      }

      .hidden {
        display: none !important;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="wordmark">Convor</span>
      <span class="badge">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Loading…</span>
      </span>
    </header>

    <main>
      <div class="slug-row">
        <span class="label">Org</span>
        <span id="slug" class="value">—</span>
      </div>
      <div id="host-row" class="host-row hidden">
        <span class="label">On page</span>
        <span id="host" class="value"></span>
      </div>

      <button id="inject" class="primary" disabled>Inject widget now</button>

      <label id="auto-row" class="toggle-row hidden">
        <span class="text">
          <strong>Auto-inject on this site</strong>
          <small>Adds the host to your allow-list</small>
        </span>
        <span class="switch">
          <input id="auto" type="checkbox" />
          <span class="track"></span>
        </span>
      </label>
    </main>

    <footer>
      <button id="options" class="ghost" type="button">Options</button>
      <span id="toast" class="toast"></span>
    </footer>

    <script src="dist/popup.js"></script>
  </body>
</html>
