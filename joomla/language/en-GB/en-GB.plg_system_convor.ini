PLG_SYSTEM_CONVOR="Convor Live Chat"
PLG_SYSTEM_CONVOR_XML_DESCRIPTION="<p>Add the <a href=\"https://convor.io\" target=\"_blank\" rel=\"noopener\">Convor</a> live-chat widget to your Joomla site. Enter your organization slug and the widget loads on every front-end page via a single script tag. All appearance (color, position, greeting, allowed domains) is managed in the Convor dashboard.</p>"

PLG_SYSTEM_CONVOR_FIELD_ENABLED_LABEL="Enable Convor Widget"
PLG_SYSTEM_CONVOR_FIELD_ENABLED_DESC="Master switch. When set to No, the widget script is not injected and there is zero overhead."

PLG_SYSTEM_CONVOR_FIELD_ORG_SLUG_LABEL="Organization Slug"
PLG_SYSTEM_CONVOR_FIELD_ORG_SLUG_DESC="Your Convor organization slug, found in the Convor dashboard under Settings &rarr; Widget. Required for the widget to load."
PLG_SYSTEM_CONVOR_FIELD_ORG_SLUG_HINT="your-org-slug"

PLG_SYSTEM_CONVOR_FIELD_API_BASE_LABEL="Widget Script Base URL"
PLG_SYSTEM_CONVOR_FIELD_API_BASE_DESC="The base URL the widget script is loaded from. Defaults to https://cdn.convor.io. Only change this to point at a custom CDN or a staging environment."
