<!--
  Use with the Sky-Shop cookie popup. Replace YOUR_WIDGET_KEY with the
  public site key and choose analytics or marketing to match your popup.
  Keep any data-convor-verification attribute from the Convor embed code.
  This replaces the direct widget embed in W nagłówku <HEAD>.
-->
<script
  type="text/plain"
  src="https://cdn.convor.io/widget.js"
  data-key="YOUR_WIDGET_KEY"
  data-convor-sky-shop-category="analytics"
></script>
<script>
  (() => {
    const config = document.currentScript.previousElementSibling;
    if (!config || config !== document.querySelector("script[data-convor-sky-shop-category]")) return;

    const category = config.dataset.convorSkyShopCategory;
    const key = config.dataset.key;
    if (!["analytics", "marketing"].includes(category) || !key?.startsWith("convor_wpk_")) return;

    let requested = false;
    let ownedWidget;

    function hasConsent() {
      try {
        const cookie = document.cookie.split(/;\s*/).find((part) => part.startsWith("cc_cookie="));
        if (!cookie) return false;
        const value = cookie.slice("cc_cookie=".length);
        const { categories } = JSON.parse(value.startsWith("{") ? value : decodeURIComponent(value));
        return Array.isArray(categories) && categories.includes(category);
      } catch {
        return false;
      }
    }

    function syncConsent() {
      if (!hasConsent()) {
        ownedWidget?.destroy();
        ownedWidget = undefined;
        return;
      }
      if (ownedWidget) return;
      const widget = window.Convor;
      if (widget) {
        if (!widget.createWidget || widget.getInstances?.().length !== 0) return;
        const installation = widget.createWidget({
          key,
          widgetUrl: new URL("widget-iframe.html", config.src).href,
        });
        // The instance is registered before initialization finishes, so a
        // withdrawal can destroy this instance even during startup.
        [ownedWidget] = widget.getInstances();
        installation.catch(() => {});
        return;
      }
      if (requested) return;

      requested = true;
      const loader = document.createElement("script");
      loader.src = config.src;
      loader.addEventListener("load", syncConsent, { once: true });
      document.head.append(loader);
    }

    function watchConsent() {
      syncConsent();
      // The Sky-Shop popup keeps its consent callbacks private. Read the
      // current cookie so a withdrawal works in the same document.
      window.setInterval(syncConsent, 500);
      document.addEventListener("visibilitychange", syncConsent);
      window.addEventListener("pageshow", syncConsent);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", watchConsent, { once: true });
    } else {
      watchConsent();
    }
  })();
</script>
