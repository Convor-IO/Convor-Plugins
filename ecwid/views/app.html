<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Convor — Settings</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --card: #ffffff;
        --border: #e3e6f0;
        --accent: #3a47ff;
        --accent-hover: #2c37e0;
        --text: #1a1d2b;
        --muted: #6b7185;
        --danger: #d33;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      .wrap { max-width: 560px; margin: 0 auto; }
      header {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 24px;
      }
      .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
      .logo span { color: var(--accent); }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 20px;
      }
      h1 { font-size: 18px; margin: 0 0 6px; }
      .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
      label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
      .field { margin-bottom: 16px; }
      input[type="text"], input[type="url"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        background: #fff;
        color: var(--text);
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      .help { font-size: 12px; color: var(--muted); margin-top: 6px; }
      .actions { display: flex; gap: 12px; align-items: center; }
      button {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 11px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover { background: var(--accent-hover); }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      button.uninstall {
        background: transparent;
        color: var(--danger);
        border: 1px solid var(--border);
        margin-left: auto;
      }
      button.uninstall:hover { background: #fff0f0; }
      #status {
        font-size: 14px; padding: 0 4px; min-height: 20px;
      }
      #status.ok { color: #1a8a3f; }
      #status.err { color: var(--danger); }
      code { background: #eef0fa; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo">Con<span>vor</span></div>
      </header>

      <div class="card">
        <h1>Convor live chat</h1>
        <p class="sub">Connect your Ecwid store to a Convor organization.</p>

        <form id="settings-form" autocomplete="off">
          <input type="hidden" name="storeId" value="__STORE_ID__" />

          <div class="field">
            <label for="slug">Convor organization slug</label>
            <input
              type="text"
              id="slug"
              name="slug"
              value="__SLUG__"
              placeholder="your-org"
              required
            />
            <div class="help">
              Found in your Convor dashboard URL, e.g.
              <code>convor.io/app/your-org</code>.
            </div>
          </div>

          <div class="field">
            <label for="apiBase">Widget API base (optional)</label>
            <input
              type="url"
              id="apiBase"
              name="apiBase"
              value="__API_BASE__"
              placeholder="https://cdn.convor.io"
            />
            <div class="help">
              Where <code>widget.js</code> is served from. Leave blank for the
              default Convor CDN.
            </div>
          </div>

          <div class="actions">
            <button type="submit" id="save">Save &amp; enable widget</button>
            <button type="button" id="uninstall" class="uninstall">Uninstall</button>
            <span id="status"></span>
          </div>
        </form>
      </div>
    </div>

    <script>
      (() => {
        var form = document.getElementById("settings-form");
        var status = document.getElementById("status");
        var saveBtn = document.getElementById("save");

        function show(msg, kind) {
          status.textContent = msg;
          status.className = kind || "";
        }

        form.addEventListener("submit", (e) => {
          e.preventDefault();
          saveBtn.disabled = true;
          show("Saving…");
          var payload = {
            storeId: form.elements.storeId.value,
            slug: form.elements.slug.value.trim(),
            apiBase: form.elements.apiBase.value.trim(),
          };
          fetch("/api/settings", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          })
            .then((r) => r.json().then((body) => ({ ok: r.ok, status: r.status, body: body })))
            .then((res) => {
              if (res.ok) {
                show("Saved — widget is live on your storefront.", "ok");
              } else {
                show(res.body?.error || "Save failed.", "err");
              }
            })
            .catch(() => {
              show("Network error.", "err");
            })
            .finally(() => {
              saveBtn.disabled = false;
            });
        });

        document.getElementById("uninstall").addEventListener("click", () => {
          if (!confirm("Remove Convor from this store?")) return;
          show("Removing…");
          fetch(
            `/api/uninstall?storeId=${encodeURIComponent(form.elements.storeId.value)}`,
            { method: "DELETE" },
          )
            .then((r) => r.ok ? { ok: true } : r.json())
            .then(() => {
              show("Uninstalled. You can close this window.", "ok");
            })
            .catch(() => {
              show("Network error.", "err");
            });
        });
      })();
    </script>
  </body>
</html>
