<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Install Convor for Ecwid</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1226;
        --card: #171a35;
        --accent: #5b6cff;
        --text: #f5f6ff;
        --muted: #9aa0c7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(120% 120% at 50% 0%, #1b1f44 0%, var(--bg) 60%);
        color: var(--text);
        padding: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid #2a2f55;
        border-radius: 16px;
        padding: 40px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }
      .logo { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
      .logo span { color: var(--accent); }
      h1 { font-size: 22px; margin: 24px 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
      a.cta {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 10px;
        font-weight: 600;
        transition: transform 0.05s ease, filter 0.15s ease;
      }
      a.cta:hover { filter: brightness(1.08); }
      a.cta:active { transform: translateY(1px); }
      .hint { font-size: 13px; color: var(--muted); margin-top: 20px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">Con<span>vor</span></div>
      <h1>Install Convor on your Ecwid store</h1>
      <p>
        Add live chat to your storefront in one click. You'll authorize Convor
        via Ecwid, then enter your Convor organization slug to go live.
      </p>
      <a class="cta" href="__AUTHORIZE_URL__">Connect with Ecwid</a>
      <div class="hint">Secure OAuth via Ecwid — we never see your password.</div>
    </div>
  </body>
</html>
